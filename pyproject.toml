[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcdagger"
version = "0.1.0"
description = "Policy-Calibrated DAgger: offline calibrated noise injection for interactive imitation learning"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Jenny Wang", email = "jennyw2@andrew.cmu.edu" }]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "torch",
    "pyarrow",
    # The training / evaluation stack. Pinned to the jwang078 fork until the hooks it
    # needs are upstream (see MIGRATION_PLAN.md, "What stays in the lerobot fork").
    "lerobot @ git+https://github.com/jwang078/lerobot.git",
]

[project.scripts]
# Drop-in replacements for lerobot-train / lerobot-eval that add the paper's training and
# evaluation machinery (multi-source + DART datasets, policy wrappers, intervention mode).
pcdagger-train = "pcdagger.train:main"
pcdagger-eval = "pcdagger.dagger.eval:main"

[project.optional-dependencies]
# The two simulated tasks of the paper (planar reacher, engine lever) and the RRT oracle expert.
splatsim = [
    "splatsim @ git+https://github.com/jwang078/SplatSim.git",
]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["pcdagger*"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["paper", "sandbox", "scripts"]   # one-off figure/experiment scripts are not linted
