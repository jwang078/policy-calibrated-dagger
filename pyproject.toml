[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcdagger"
version = "0.1.0"
description = "Policy-Calibrated DAgger: offline calibrated noise injection for interactive imitation learning"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Jenny Wang", email = "jennyw2@andrew.cmu.edu" }]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "torch",
    "pyarrow",
    # The training / evaluation stack: the jwang078 fork, pinned to the tag that
    # tests/test_dependency_contract.py and paper/tables_repro/smoke_test.sh were last run against.
    # Move the pin after re-running `bash scripts/check_dependency_contract.sh` (see README, "Keeping up
    # with lerobot and SplatSim"). What the fork carries: MIGRATION_PLAN.md, "What stays in the lerobot fork".
    "lerobot @ git+https://github.com/jwang078/lerobot.git@pcdagger-compat-2026-09-21",
]

[project.scripts]
# Drop-in replacements for lerobot-train / lerobot-eval that add the paper's training and
# evaluation machinery (multi-source + DART datasets, policy wrappers, intervention mode).
pcdagger-train = "pcdagger.train:main"
pcdagger-eval = "pcdagger.dagger.eval:main"

[project.optional-dependencies]
# The two simulated tasks of the paper (planar reacher, engine lever) and the RRT oracle expert.
splatsim = [
    "splatsim @ git+https://github.com/jwang078/SplatSim.git@pcdagger-compat-2026-09-21",
]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["pcdagger*"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["paper", "sandbox", "scripts"]   # one-off figure/experiment scripts are not linted
