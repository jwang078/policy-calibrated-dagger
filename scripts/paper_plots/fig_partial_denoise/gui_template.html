<title>Partial Denoising Styler</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f4f5f7;--panel:#ffffff;--ink:#1c2128;--muted:#5d6672;--line:#d9dde3;--accent:#2a5f9e;--accent-ink:#ffffff;--code:#eef1f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171a1f;--panel:#1f242b;--ink:#e6e9ee;--muted:#9aa4b1;--line:#343b45;--accent:#6aa5e6;--accent-ink:#0f1318;--code:#262c35}}
:root[data-theme="dark"]{--bg:#171a1f;--panel:#1f242b;--ink:#e6e9ee;--muted:#9aa4b1;--line:#343b45;--accent:#6aa5e6;--accent-ink:#0f1318;--code:#262c35}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;padding-inline:16px;padding-block:14px}
h1{font-size:17px;font-weight:600;margin:0 0 10px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px}
@media (max-width:1000px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.chart{position:sticky;top:10px}
svg{width:100%;max-width:680px;height:auto;background:#fff;border-radius:4px;display:block;margin:0 auto}
fieldset{border:1px solid var(--line);border-radius:6px;margin:0 0 10px;padding:8px 10px}
legend{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.row{display:flex;gap:8px;align-items:center;margin:5px 0;flex-wrap:wrap}
.row label{flex:0 0 104px;color:var(--muted);font-size:12.5px}
.row input[type=text],.row select{flex:1 1 110px;min-width:0;font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.row input[type=range]{flex:1 1 100px}
.row input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
.row .num{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);width:44px;text-align:right}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin:5px 0}
button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:5px;cursor:pointer}
button.ghost{background:none;color:var(--accent)}
pre{background:var(--code);border-radius:6px;padding:10px;font:12px/1.45 "IBM Plex Mono",monospace;overflow-x:auto;max-height:260px;white-space:pre}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
</style>

  <div class="panel" id="ctl"></div>
</div>

const out = document.createElement('div'); out.innerHTML = `<div class="row"><button id="copy">Copy CONFIG</button><button class="ghost" id="reset">Reset</button></div><pre id="cfg"></pre>`; ctl.appendChild(out);
function pyRepr(v) { if (typeof v === 'string') { return v.includes('\\') ? 'r"' + v.replace(/"/g, '\\"') + '"' : JSON.stringify(v); } if (typeof v === 'boolean') return v ? 'True' : 'False'; if (typeof v === 'number') return String(v); if (Array.isArray(v)) return '[' + v.map(pyRepr).join(', ') + ']'; return '{' + Object.entries(v).map(([k, x]) => `${JSON.stringify(k)}: ${pyRepr(x)}`).join(', ') + '}'; }
